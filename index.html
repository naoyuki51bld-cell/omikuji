<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf4ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おみくじ">
<title>今日のおみくじ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&family=Shippori+Mincho:wght@700;800&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  html, body { margin: 0; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
  .login-card { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
  .login-card input {
    width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 10px; background: #fff; color: var(--ink);
  }
  .login-note { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
  .s-account { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="loading">読み込み中…</div></div></div>
<script type="module" src="app.js"></script>
</body>
</html>
